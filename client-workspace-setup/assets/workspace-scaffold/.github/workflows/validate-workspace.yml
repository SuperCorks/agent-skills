name: Validate workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate workspace consistency
        run: ./scripts/validate-workspace.sh
      - name: Test bootstrap safety
        run: ./tests/bootstrap.sh
{{GATEWAY_CI_STEP}}