<!doctype html>
<html lang="en" data-template="plan" data-audience="internal" data-kernel-kind="report" data-kernel-contract="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan title</title>
</head>
<body>
<header class="hero">
  <p class="eyebrow">Implementation plan</p>
  <h1>Plan title</h1>
  <p class="lede"><!-- guide: one-paragraph north star: the outcome, for whom, and why now. --></p>
  <dl class="meta"><div><dt>Status</dt><dd>Draft for review</dd></div><div><dt>Updated</dt><dd>YYYY-MM-DD</dd></div><div><dt>Owner</dt><dd>Name</dd></div></dl>
</header>
<main>
<!-- guide: a compact starting shell. The html-plan skill owns content coverage; combine concerns or add sections where needed rather than filling a fixed outline. Add question cards only for unresolved choices requiring reader input. Preserve all existing ids when revising a shared plan. -->
<section id="target" data-toc="Target">
  <h2>Target behavior</h2>
  <!-- guide: the concrete change, its scope and constraints, and the evidence for this approach. Show a before/after example or product mockup when it explains the outcome. Compare alternatives only when there is a meaningful choice. -->
</section>
<section id="phases">
  <h2>Phases</h2>
  <!-- guide: the executable steps, dependencies, owners, and exit criteria. Use phases only when the work has meaningful stages; include rollout, risks, and handoff detail where relevant. -->
</section>
<section id="acceptance">
  <h2>How we will verify the outcome</h2>
  <!-- guide: testable acceptance criteria with the checks needed to prove them. Use a checklist or a matrix as appropriate; avoid duplicating the same criteria in a separate QA section. -->
</section>
</main>
</body>
</html>
