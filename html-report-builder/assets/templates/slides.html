<!doctype html>
<html lang="en" data-template="slides" data-audience="client" data-kernel-kind="deck" data-kernel-contract="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck title</title>
</head>
<body>
<main class="deck">
<!-- guide: a minimal starting shell, not a fixed story arc. Add, merge, reorder, or omit slides for the audience's purpose. A short deck may state the answer on its cover. Options, phases, risks, an agenda, and an ask are conditional. -->
<section class="slide cover" id="s1" data-toc="Cover" data-kernel-slide>
  <p class="eyebrow">Prepared by Red Krypton for Client · Month YYYY</p>
  <h1><!-- guide: the deck's promise or answer in under 10 words. --></h1>
  <p class="lede"><!-- guide: a necessary implication or context; omit if the title already conveys the message. --></p>
</section>
<aside class="notes"><p><!-- guide: brief presenter context, if needed; do not repeat the slide. Delete this aside if no notes are needed. --></p></aside>

<section class="slide" id="s2" data-kernel-slide>
  <p class="eyebrow"><!-- guide: short topic label, if helpful. --></p>
  <h2><!-- guide: the next takeaway the audience needs to understand. --></h2>
  <!-- guide: one component or short explanation that supports this takeaway. Keep essential reasoning and decision-changing caveats visible; choose additional layouts from the catalogue only as needed. -->
</section>
<aside class="notes"><p><!-- guide: a source or likely follow-up answer the presenter needs. Keep it brief and client-safe; delete this aside if no notes are needed. --></p></aside>
</main>
</body>
</html>
